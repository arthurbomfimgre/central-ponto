// Detecta se os CDNs carregaram

  if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
    document.getElementById('error-detail').textContent =
      'React ou ReactDOM nao carregaram. Verifique a conexao com a internet.';
    document.getElementById('error-box').classList.add('show');

    return false;
  }
  return true;
};

// Fallback localStorage
function lerLS(key, fb) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch (_e) { return fb; }
}
function salvarLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (_e) {}
}

// Comprime/redimensiona uma imagem (foto do EasyMob) antes de enviar ao
// Supabase. Fotos de celular sem compressão chegam a vários MB em base64,
// o que pode falhar silenciosamente ao salvar (timeout, payload grande
// demais) — o print "parecia" enviado no aparelho do funcionário, mas nunca
// chegava ao banco para o admin ver. Reduzir para no máximo 1280px no lado
// maior e comprimir como JPEG resolve isso, mantendo a foto legível.
// Extrai uma mensagem de erro segura (sempre string) a partir de qualquer
// formato de erro que o Supabase ou o navegador possam lançar. Necessário
// porque erros HTTP 500 do GoTrue (Auth) às vezes chegam como objetos sem
// `.message` legível, ou até como erros de rede genéricos — sem essa
// blindagem com `typeof` explícito, um objeto podia acabar sendo passado
// como children de um elemento React, que então renderizava literalmente
// "{}" na tela em vez de um texto compreensível para o usuário.
function extrairMensagemErro(err) {
  if (typeof err === "string" && err) return err;
  if (err && typeof err === "object") {
    const candidatos = [err.message, err.error_description, err.msg, err.error, err.statusText];
    for (const c of candidatos) {
      if (typeof c === "string" && c) return c;
    }
    if (typeof err.status === "number" && err.status > 0) {
      return `Erro no servidor (código ${err.status}). Tente novamente em alguns minutos.`;
    }
  }
  return "Não foi possível concluir a operação. Tente novamente.";
}

function comprimirImagem(dataUrl, maxLado = 1280, qualidade = 0.75) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxLado || height > maxLado) {
        const escala = maxLado / Math.max(width, height);
        width = Math.round(width * escala);
        height = Math.round(height * escala);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", qualidade));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Ler do Supabase (retorna array de objetos ou valor easymob)
async function lerSupa(key, fb) {
  try {
    const table = KEY_TABLE[key];
    if (!table) return fb;
    // A chave real usada pelo app para o mapa de prints do EasyMob tem o
    // sufixo "_map" (ex: "cp_easymob_v4_map") — precisa ser tratada do mesmo
    // jeito que SK_EASYMOB (chave/valor simples), senão cai no ramo de baixo
    // que espera um array com campo `id`, formato incompatível com a tabela.
    if (key === SK_EASYMOB || key === `${SK_EASYMOB}_map`) {
      const { data } = await supa.from(table).select("*");
      if (!data || data.length === 0) return fb;
      // easymob armazena chave/valor simples
      const obj = {};
      data.forEach(r => { obj[r.chave] = r.data; });
      return obj;
    }
    // `funcionarios_administrativo` (migração de ago/2026) usa colunas
    // tipadas próprias (id uuid, nome, matricula, setor, cargo, ativo,
    // esquecimentos, atestados, etc.) em vez do padrão `data jsonb` solto
    // que as outras tabelas de useSharedState usam — não há coluna `data`
    // aqui, então lê-se a linha inteira direto.
    const { data } = await supa.from(table).select(key === SK_FUNCS ? "*" : "data");
    if (!data || data.length === 0) return fb;
    const result = key === SK_FUNCS ? data : data.map(r => r.data);
    _cache[key] = result;
    salvarLS(key, result);
    return result;
  } catch (_e) {
    return _cache[key] ?? lerLS(key, fb);
  }
}

// Salvar no Supabase (substitui todos os registros da tabela).
// Retorna { ok: true } ou { ok: false, erro } — o chamador decide o que
// fazer com a falha (ex: avisar o usuário). Antes, qualquer erro era
// engolido em silêncio e a interface sempre mostrava "salvo com sucesso",
// mesmo quando o dado nunca chegava ao banco (ex: print do EasyMob).
async function salvarSupa(key, val) {
  try {
    _cache[key] = val;
    salvarLS(key, val); // cache local imediato
    const table = KEY_TABLE[key];
    if (!table) return { ok: true };

    // Mesma correção: a chave real usada pelo app tem o sufixo "_map" (ex:
    // "cp_easymob_v4_map") e precisa ser tratada como objeto chave->valor,
    // igual SK_EASYMOB — senão caía no ramo de array por engano (ou, antes
    // da correção do KEY_TABLE, nem chegava a entrar aqui).
    if (key === SK_EASYMOB || key === `${SK_EASYMOB}_map`) {
      // easymob é um objeto chave->valor
      if (typeof val !== "object" || !val) return { ok: true };
      for (const [chave, dado] of Object.entries(val)) {
        // .select() força o Supabase a retornar a linha realmente gravada —
        // sem isso, um upsert bloqueado silenciosamente por RLS pode não
        // reportar `error` algum, mas também não persistir nada, fazendo a
        // UI achar que deu certo quando na verdade não salvou.
        const { data: linhaSalva, error } = await supa.from(table).upsert({ chave, data: dado }, { onConflict: "chave" }).select();
        if (error) {
          console.error("[EASYMOB UPSERT ERROR]", { chave, tamanhoDado: dado?.length, error });
          return { ok: false, erro: error.message };
        }
        if (!linhaSalva || linhaSalva.length === 0) {
          console.error("[EASYMOB UPSERT SEM RETORNO]", { chave, tamanhoDado: dado?.length });
          return { ok: false, erro: "O registro não foi confirmado pelo banco (possível bloqueio de permissão)." };
        }
      }
      return { ok: true };
    }

    // Para listas: upsert cada item pelo id
    if (!Array.isArray(val)) return { ok: true };
    // `funcionarios_administrativo` usa id UUID (não numérico) — a
    // sentinela -999999 usada pelas outras tabelas (id inteiro) não serve
    // aqui; um filtro sempre-verdadeiro (`id.not.is.null`) tem o mesmo
    // efeito de "apagar tudo".
    if (val.length === 0) {
      if (key === SK_FUNCS) await supa.from(table).delete().not("id", "is", null);
      else await supa.from(table).delete().neq("id", -999999);
      return { ok: true };
    }
    // `funcionarios_administrativo` (colunas tipadas, sem `data` jsonb) faz
    // upsert do objeto inteiro direto; as demais tabelas (formato antigo)
    // continuam envelopando o item em `data`.
    const rows = val.map(item => key === SK_FUNCS ? { ...item } : { id: item.id, data: item });
    const { error: errUpsert } = await supa.from(table).upsert(rows, { onConflict: "id" });
    if (errUpsert) return { ok: false, erro: errUpsert.message };

    // Remove ids que não existem mais. `funcionarios_administrativo` usa id
    // UUID (precisa de aspas em cada valor do filtro .in); as demais tabelas
    // usam id inteiro (sem aspas), como já era antes.
    const ids = val.map(i => i.id);
    const idsFiltro = key === SK_FUNCS ? ids.map(id => `"${id}"`).join(",") : ids.join(",");
    await supa.from(table).delete().not("id", "in", "(" + idsFiltro + ")");
    return { ok: true };
  } catch (e) {
    // Falha de rede/inesperada — já salvou no localStorage como fallback,
    // mas o chamador precisa saber que não sincronizou com o banco.
    console.error("[SALVARSUPA EXCEPTION]", { key, error: e });
    return { ok: false, erro: e?.message || "Falha de conexão" };
  }
}

// Hook principal — carrega do Supabase, mantém sincronia via polling
//
// `sessaoPronta` (booleano) indica se a verificação inicial de sessão
// (supa.auth.getSession(), que decide de forma ASSÍNCRONA se o login é de
// conta de teste ou real) já terminou. Enquanto ela não terminar, este hook
// NÃO pode buscar nem cachear dados reais do Supabase — porque, no cenário
// de navegador limpo + sessão restaurada de conta teste, o componente App()
// monta e os hooks useSharedState() já disparavam a busca real de forma
// síncrona/imediata no primeiro render, antes do getSession() assíncrono
// ainda descobrir e marcar contaTesteAtiva(). O resultado era um "flash" de
// dados reais e, pior, esses dados reais chegavam a ser gravados em
// salvarLS(key) e em _cache[key] — poluindo o cache local mesmo depois de a
// flag de teste ser ativada. Bloquear a leitura/gravação real até
// sessaoPronta === true elimina essa corrida por completo.
function useSharedState(key, initial, sessaoPronta, contaTesteFlag) {
  // Conta de teste: nunca lê nem grava no Supabase. Todo o estado fica
  // isolado sob uma chave própria no localStorage ("cp_teste_<key>"),
  // começando vazio ([]/{} conforme o tipo do `initial`, nunca os dados
  // reais de seed) e persistindo só nesse dispositivo entre login/logout.
  const chaveTeste = `cp_teste_${key}`;
  const vazio = Array.isArray(initial) ? [] : (initial && typeof initial === "object" ? {} : initial);

  const [state, setRaw] = useState(() => {
    // Sessão ainda não verificada: nunca usar _cache/localStorage "reais"
    // aqui, pois não sabemos ainda se este é um login de conta de teste.
    // Começa vazio/neutro; o efeito abaixo (assim que sessaoPronta virar
    // true) é quem decide a fonte correta.
    if (!sessaoPronta) return vazio;
    if (contaTesteAtiva()) return lerLS(chaveTeste, vazio);
    return _cache[key] ?? lerLS(key, initial);
  });
  const loaded = useRef(false);
  // A flag de conta de teste é ativada de forma assíncrona (dentro de um
  // useEffect de login/restauração de sessão), então pode passar a valer
  // *depois* que este hook já rodou seu useState inicial acima — nesse
  // caso o estado ficaria "preso" nos dados reais para sempre, mesmo com
  // a flag ativa. Este efeito detecta a mudança e recarrega do
  // localStorage isolado assim que ela acontece.
  //
  // IMPORTANTE: as dependências incluem `contaTesteFlag` (não só
  // `sessaoPronta`). No login manual (tela de login, sem F5), a tela de
  // login já é renderizada com sessaoPronta=true e usuario=null — ou
  // seja, useSharedState já dispara sua carga real do Supabase enquanto
  // o usuário ainda está digitando a senha. Quando o login como conta
  // teste é concluído, `contaTesteAtiva()` muda de false->true, mas
  // `sessaoPronta` continua true e não muda — então, sem essa dependência
  // extra, este efeito nunca rodava de novo e o estado ficava travado nos
  // dados reais já carregados durante a tela de login (só sumiam com F5,
  // que reinicia sessaoPronta do zero). Passar um valor derivado do
  // usuário logado (ex: contaTesteAtivaAgora) força este efeito a reagir
  // exatamente no momento em que o login como conta teste se efetiva.
  const modoTesteAnterior = useRef(null);
  useEffect(() => {
    if (!sessaoPronta) return;
    const modoTesteAgora = contaTesteAtiva();
    if (modoTesteAgora !== modoTesteAnterior.current) {
      modoTesteAnterior.current = modoTesteAgora;
      setRaw(modoTesteAgora ? lerLS(chaveTeste, vazio) : (_cache[key] ?? lerLS(key, initial)));
    }
  }, [sessaoPronta, contaTesteFlag]);

  // Carga inicial do Supabase — pulada inteiramente em modo teste, e
  // adiada até a sessão estar verificada (ver comentário acima do hook).
  // Também repetida quando contaTesteFlag muda para false (ex: logout da
  // conta teste seguido de login como conta real), garantindo que os
  // dados reais voltem a ser buscados nesse caso.
  useEffect(() => {
    if (!sessaoPronta) return;
    if (contaTesteAtiva()) return;
    lerSupa(key, initial).then(val => {
      if (val !== null && val !== undefined) {
        setRaw(val);
        loaded.current = true;
      }
    });
  }, [key, sessaoPronta, contaTesteFlag]);

  // Polling a cada 3s para sincronizar entre dispositivos — desligado em
  // modo teste e enquanto a sessão ainda não foi verificada
  useEffect(() => {
    if (!sessaoPronta) return;
    if (contaTesteAtiva()) return;
    const id = setInterval(async () => {
      const fresh = await lerSupa(key, null);
      if (fresh !== null && fresh !== undefined) {
        setRaw(prev => {
          const ps = JSON.stringify(prev), fs = JSON.stringify(fresh);
          return ps !== fs ? fresh : prev;
        });
      }
    }, 3000);
    return () => clearInterval(id);
  }, [key, sessaoPronta]);

  // Ref sempre sincronizado com o `state` mais recente. Necessário porque
  // `setState` abaixo precisa ler o valor atual de forma síncrona (sem
  // esperar o callback de setRaw, que não tem timing garantido — ver
  // comentário dentro de setState), mas sem colocar `state` nas deps do
  // useCallback, o que mudaria a identidade de setState a cada render e
  // podia quebrar outros efeitos/memos deste arquivo que assumem que
  // setState é estável entre renders.
  const stateRef = useRef(state);
  stateRef.current = state;

  const setState = useCallback(valOrFn => {
    // IMPORTANTE: `next` precisa estar pronto ANTES de qualquer await/Promise
    // e não pode depender do callback passado a setRaw ser executado a
    // tempo — setRaw(prev => ...) é assíncrono (o React apenas agenda a
    // atualização), então esperar o callback rodar para popular `next` não
    // tem garantia nenhuma de timing. Antes, isso podia deixar `next`
    // undefined no momento de chamar salvarSupa(key, next); salvarSupa
    // recebia um valor não-objeto/undefined, caía no early-return
    // `{ ok: true }` e a UI mostrava "salvo com sucesso" sem nunca ter
    // enviado nada ao Supabase (era exatamente o bug do print do EasyMob
    // não chegar ao banco). Ler stateRef.current resolve `next` de forma
    // síncrona e sempre atualizada, sem depender do timing do React nem
    // mudar a identidade desta função.
    const next = typeof valOrFn === "function" ? valOrFn(stateRef.current) : valOrFn;
    stateRef.current = next;
    setRaw(next);
    if (contaTesteAtiva()) {
      // Grava só localmente, isolado da chave real — nunca chama o Supabase.
      return Promise.resolve().then(() => {
        salvarLS(chaveTeste, next);
        return { ok: true };
      });
    }
    // Retorna a Promise do salvamento — chamadores que precisam confirmar
    // sucesso (ex: upload de print do EasyMob) podem usar `await`; os demais
    // continuam funcionando normalmente ao ignorar o retorno.
    return Promise.resolve().then(() => salvarSupa(key, next));
  }, [key]);

  return [state, setState];
}

// Hook de tema — preferência local por dispositivo (não sincroniza entre usuários)
function useTheme() {
  const [theme, setTheme] = useState(() => lerLS("cp_tema", "light"));

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    salvarLS("cp_tema", theme);
  }, [theme]);

  const toggleTheme = useCallback(() => {
    setTheme(prev => prev === "dark" ? "light" : "dark");
  }, []);

  return [theme, toggleTheme];
}

// cadastrados (ver `setoresDisponiveis` em cada componente que usa filtro

const STATUS_LIST = ["Pendente", "Corrigido", "Verificado", "Rejeitado"];
const TIPOS_OCORRENCIA = ["Esquecimento", "Erro de Registro", "Atestado Médico", "Falta", "Banco de Horas", "Abono", "Integração"];
const TIPO_EXIGE_EASYMOB = "Erro de Registro";

const TIPOS_DIRETO = ["Falta", "Banco de Horas", "Abono", "Integração", "Atestado Médico"];
// Tipo genérico criado pelo admin: o colaborador é quem especifica o motivo depois

const CAMPO_POR_TIPO = {

// Calcula os contadores de um funcionário SEMPRE ao vivo a partir da lista real
// de ocorrências (em vez de depender de campos fixos salvos no funcionário).
// Isso evita qualquer dessincronia ao criar/excluir/especificar ocorrências.
// Ocorrências Rejeitadas não entram na contagem.
// `funcionarioOuId` aceita tanto o objeto do funcionário quanto (por
// compatibilidade com chamadas antigas) só o id. Desde a migração de
// ago/2026, `funcionarios_administrativo` (id UUID) e `funcionarios_comercial`
// (id inteiro sequencial) nunca colidem em id — não é mais preciso saber a
// origem para contar corretamente, basta o funcionario_id.
function contarOcorrencias(ocorrencias, funcionarioOuId) {
  const ehObjeto = funcionarioOuId && typeof funcionarioOuId === "object";
  const funcionarioId = ehObjeto ? funcionarioOuId.id : funcionarioOuId;
  const contagem = {
    esquecimentos: 0,
    atestados: 0,
    faltas: 0,
    banco_horas: 0,
    erros_registro: 0,
    abonos: 0,
    integracoes: 0
  };
  ocorrencias.forEach(o => {
    if (o.funcionario_id !== funcionarioId) return;
    if (o.status === "Rejeitado") return;
    const campo = CAMPO_POR_TIPO[o.tipo];
    if (campo) contagem[campo] += 1;
  });
  const total = contagem.esquecimentos + contagem.atestados + contagem.faltas + contagem.banco_horas + contagem.erros_registro + contagem.abonos + contagem.integracoes;
  return { ...contagem, total };
}
// Gera o e-mail de login a partir do nome do funcionário, no padrão
// primeironome.sobrenome@portovale.com.br (tudo minúsculo, sem acento).
// O e-mail é usado só para autenticar no Supabase Auth — a senha real nunca
// fica no código-fonte, só no Supabase.
// Calcula o "nome de exibição" de cada funcionário da lista comercial, para
// uso em toda a UI do Painel de Acessos (árvore, cards, listas de resumo,
// mensagens de log/erro): usa o apelido cadastrado na planilha quando
// existe; se não existir, usa os 2 primeiros nomes da pessoa — e só cresce
// para 3, 4... nomes quando essa combinação de 2 primeiros nomes colide com
// a de outro funcionário SEM apelido na mesma lista (colisão = mesmos 2
// primeiros nomes; funcionários com apelido nunca entram nessa comparação,
// já que exibem o apelido e não competem por "2 primeiros nomes").
// Retorna um Map: id do funcionário -> nome de exibição (string).
function calcularNomesExibicao(funcionarios) {
  const resultado = new Map();
  // Funcionários que vão exibir os primeiros nomes (sem apelido cadastrado).
  const semApelido = funcionarios.filter(f => !(f.apelido && String(f.apelido).trim()));
  funcionarios.forEach(f => {
    if (f.apelido && String(f.apelido).trim()) {
      resultado.set(f.id, String(f.apelido).trim().toUpperCase());
    }
  });
  // Para cada funcionário sem apelido, tenta com 2 nomes; se colidir com
  // outro (mesmos 2 primeiros nomes), tenta 3, depois 4, até desambiguar ou
  // esgotar as partes do nome completo (nesse caso, usa o nome inteiro).
  semApelido.forEach(f => {
    const partes = String(f.nome_completo || "").trim().split(/\s+/).filter(Boolean);
    let qtd = Math.min(2, partes.length);
    let candidato = partes.slice(0, qtd).join(" ");
    const colideComOutro = (nomeTentativa, qtdPartes) => semApelido.some(outro => {
      if (outro.id === f.id) return false;
      const partesOutro = String(outro.nome_completo || "").trim().split(/\s+/).filter(Boolean);
      return partesOutro.slice(0, qtdPartes).join(" ") === nomeTentativa;
    });
    while (colideComOutro(candidato, qtd) && qtd < partes.length) {
      qtd += 1;
      candidato = partes.slice(0, qtd).join(" ");
    }
    resultado.set(f.id, candidato || f.nome_completo || "");
  });
  return resultado;
}
// Formato básico local@dominio.tld — mesma regra usada nas Edge Functions
// de criação de login em lote (ver EMAIL_REGEX lá), para o client sinalizar
// e-mail malformado com a mesma régua usada no servidor, sem esperar o
// round-trip até o Auth pra descobrir que o formato está errado.
const EMAIL_VALIDO_REGEX = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

function gerarEmail(nomeCompleto) {
  const partes = nomeCompleto.trim().split(/\s+/);
  const primeiro = partes[0];
  const ultimo = partes[partes.length - 1];
  const normalizar = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return `${normalizar(primeiro)}.${normalizar(ultimo)}@portovale.com.br`;
}
// Retorna o e-mail real de um funcionário: usa o campo `email` customizado
// (quando cadastrado pelo admin) ou gera automaticamente pelo nome.
function emailFuncionario(func) {
  return (func.email && func.email.trim()) ? func.email.trim().toLowerCase() : gerarEmail(func.nome || func.nome_completo);
}
// Normaliza um registro vindo de `funcionarios_comercial` (tabela nova, campos

// `funcionarios` (legada) e `funcionarios_comercial` usavam sequências de
// id inteiro independentes que colidiam entre si, exigindo desambiguação
// por `origemFuncionario` com fallback ambíguo. Agora `funcionarios` foi
// substituída por `funcionarios_administrativo` (id UUID) — administrativo

function resolverFuncionarioDaOcorrencia(funcionarios, o) {
  return funcionarios.find(f => f.id === o?.funcionario_id);
}
// Rótulos de nível comercial usados como fallback de cargo (mesmos valores

const NIVEL_LABEL_FALLBACK_CARGO = {

function normalizarFuncComercial(fc) {

    cargo: fc.cargo_origem || NIVEL_LABEL_FALLBACK_CARGO[fc.nivel] || "",
    // `funcionarios_comercial` guarda status em `situacao` ('ATIVO'/outro),

    ativo: String(fc.situacao ?? "ATIVO").toUpperCase() === "ATIVO",

// ─── PERMISSÕES POR PAPEL ───────────────────────────────────────────────────
// Sistema de controle de acesso configurável pelo admin_geral: cada papel da
// hierarquia comercial (vendedor/gerente/diretor/superintendente) tem um
// conjunto de permissões (chave_permissao → true/false) gravado na tabela
// Supabase `permissoes_papel`. O admin_geral NUNCA é configurável aqui — ele
// sempre tem tudo liberado, fixo no código, para não haver risco de alguém
// se trancar para fora do próprio Painel de Acessos por erro de configuração.
//
// PERMISSOES_PADRAO é o fallback usado (a) antes da tabela carregar e (b)
// para qualquer chave que não tenha uma linha explícita no banco — assim a
// tela de Permissões pode nascer vazia no Supabase e o app continua
// funcionando com as regras combinadas nesta sessão:
//   - todos os papéis veem todas as abas, exceto "hierarquia" (Painel de
//     Acessos), exclusiva do admin_geral;
//   - todos os papéis podem criar e excluir pendência/ocorrência;
//   - todo o resto de ações administrativas (editar perfil, importar
//     planilha, ver log de acessos, revogar/reativar acesso, resetar senha)
//     é exclusivo do admin_geral.
// Inclui os três níveis administrativos namespaced (admin_membro/
// admin_coordenador/admin_gerente — ver PAPEL_ADMINISTRATIVO_PARA_NIVEL em
// resolverNivel) ao lado dos comerciais, para que a tela de Permissões
// consiga configurar cada um separadamente sem colidir com o "gerente"
// comercial. A UI de toggle Administrativo/Comercial em cima desta matriz
// (mostrar só o subconjunto relevante por vez) é um passo à parte, ainda
// não feito aqui — esta mudança só garante que as chaves existem e não
// colidem, na raiz.
const NIVEIS_CONFIGURAVEIS = ["vendedor", "gerente", "diretor", "superintendente"];
const NIVEIS_CONFIGURAVEIS_ADMINISTRATIVO = ["admin_membro", "admin_coordenador", "admin_gerente"];
const PERMISSOES_CATALOGO = [
  { chave: "ver_dashboard", label: "Ver Dashboard", grupo: "Abas" },
  { chave: "ver_funcionarios", label: "Ver Funcionários", grupo: "Abas" },
  { chave: "ver_relatorios", label: "Ver Relatórios", grupo: "Abas" },
  { chave: "pendencias", label: "Criar / excluir pendência", grupo: "Ações" },
  { chave: "editar_perfil", label: "Editar perfil", grupo: "Ações" },
  { chave: "importar_planilha", label: "Importar planilha", grupo: "Ações" },
  { chave: "ver_log_acessos", label: "Ver log de auditoria", grupo: "Ações" },
  { chave: "gerenciar_acesso", label: "Revogar / reativar acesso, resetar senha", grupo: "Ações" },
  { chave: "editar_pendencias", label: "Editar / excluir qualquer pendência (Painel de Acessos)", grupo: "Ações" }
];
const PERMISSOES_PADRAO = {
  ver_dashboard: true,
  ver_funcionarios: true,
  ver_relatorios: true,
  pendencias: true,
  editar_perfil: false,
  importar_planilha: false,
  ver_log_acessos: false,
  gerenciar_acesso: false,
  editar_pendencias: false
};
// E-mails com acesso fixo a editar_pendencias, independente do que estiver
// configurado em permissoes_papel/permissoes_excecao — hoje só o GRE. Isto
// é só um piso mínimo, não um teto: dar `true` para um papel ou uma exceção
// individual na tela de Permissões também libera o acesso normalmente (ver
// pode() abaixo). Consulte este array só quando quiser ADICIONAR uma conta
// fixa; para liberar caso a caso, prefira a tela de Permissões.
const EMAILS_EDITAR_PENDENCIAS_FIXO = ["gre@portovale.com.br"];
// Carrega `permissoes_papel` do Supabase e devolve `pode(chave)` já
// resolvido para o nível do usuário logado. admin_geral sempre true, sem
// consultar tabela nenhuma. Enquanto carrega (ou se a tabela não tiver a
// linha), cai no default combinado acima — nunca bloqueia por ausência de
// configuração, só por configuração explícita como `false`.
function usePermissoes(usuario, sessaoPronta = true) {
  const [tabela, setTabela] = useState({}); // { [nivel]: { [chave]: bool } }
  // Exceções individuais: sobrepõem o padrão do papel para uma pessoa
  // específica. Chave por funcionario_id, não por usuario.id do app —
  // funcionario_id é o mesmo id estável usado em funcionarios_comercial,
  // então a exceção sobrevive a troca de nível/nome/etc.
  const [excecoes, setExcecoes] = useState({}); // { [funcionario_id]: { [chave]: bool } }
  const [carregando, setCarregando] = useState(true);
  async function buscar() {
    try {
      const [papelRes, excecaoRes] = await Promise.all([
        supa.from("permissoes_papel").select("*"),
        supa.from("permissoes_excecao").select("*")
      ]);
      if (papelRes.error) throw papelRes.error;
      if (excecaoRes.error) throw excecaoRes.error;
      const agrupado = {};
      for (const linha of papelRes.data || []) {
        if (!agrupado[linha.papel]) agrupado[linha.papel] = {};
        agrupado[linha.papel][linha.chave_permissao] = !!linha.permitido;
      }
      const agrupadoExcecao = {};
      for (const linha of excecaoRes.data || []) {
        if (!agrupadoExcecao[linha.funcionario_id]) agrupadoExcecao[linha.funcionario_id] = {};
        agrupadoExcecao[linha.funcionario_id][linha.chave_permissao] = !!linha.permitido;
      }
      setTabela(agrupado);
      setExcecoes(agrupadoExcecao);
    } catch (e) {
      // Falha ao carregar (ex.: tabela ainda não criada) — segue só com o
      // default combinado, sem travar o app.
      setTabela({});
      setExcecoes({});
    } finally {
      setCarregando(false);
    }
  }
  useEffect(() => {
    if (!sessaoPronta) return;
    buscar();
  }, [sessaoPronta]);
  // Ordem de resolução para uma chave de permissão, do mais específico para
  // o mais genérico: (1) exceção individual do funcionário logado, (2)
  // regra do papel dele, (3) default combinado no código. admin_geral
  // sempre vence tudo isso, sem exceção — nem uma linha em
  // permissoes_excecao consegue tirar acesso do admin_geral.
  function pode(chave) {
    if (usuario?.nivel === "admin_geral" || usuario?.role === "admin") return true;
    // editar_pendencias tem um piso mínimo fixo por e-mail (hoje só o GRE),
    // além de poder ser liberado normalmente via papel/exceção abaixo — ver
    // EMAILS_EDITAR_PENDENCIAS_FIXO.
    if (chave === "editar_pendencias" && EMAILS_EDITAR_PENDENCIAS_FIXO.includes(usuario?.email)) return true;
    const funcId = usuario?.funcionario_id;
    const doIndividuo = funcId != null ? excecoes[funcId]?.[chave] : undefined;
    if (doIndividuo !== undefined) return doIndividuo;
    const nivel = usuario?.nivel;
    if (!nivel) return false;
    const doNivel = tabela[nivel]?.[chave];
    if (doNivel !== undefined) return doNivel;
    return !!PERMISSOES_PADRAO[chave];
  }
  // Grava/atualiza uma permissão de um papel específico (upsert por
  // papel+chave_permissao) e atualiza o estado local na hora, sem esperar
  // um refetch — a tela de Permissões usa isto a cada toggle.
  async function definirPermissao(papel, chave, permitido) {
    setTabela(prev => ({ ...prev, [papel]: { ...(prev[papel] || {}), [chave]: permitido } }));
    const { error } = await supa.from("permissoes_papel")
      .upsert({ papel, chave_permissao: chave, permitido }, { onConflict: "papel,chave_permissao" });
    if (error) {
      // Reverte em memória se a gravação falhar, para a UI não mentir sobre
      // o estado real salvo no banco.
      await buscar();
      throw error;
    }
  }
  // Grava/atualiza uma exceção individual (upsert por
  // funcionario_id+chave_permissao). Usada pela busca de pessoa dentro da
  // tela de Permissões, para o caso do funcionário específico que foge da
  // regra geral do papel dele.
  async function definirExcecao(funcionarioId, chave, permitido) {
    setExcecoes(prev => ({ ...prev, [funcionarioId]: { ...(prev[funcionarioId] || {}), [chave]: permitido } }));
    const { error } = await supa.from("permissoes_excecao")
      .upsert({ funcionario_id: funcionarioId, chave_permissao: chave, permitido }, { onConflict: "funcionario_id,chave_permissao" });
    if (error) {
      await buscar();
      throw error;
    }
  }
  // Remove uma exceção individual, voltando aquela pessoa a seguir a regra
  // padrão do papel dela para aquela chave.
  async function removerExcecao(funcionarioId, chave) {
    setExcecoes(prev => {
      const copia = { ...(prev[funcionarioId] || {}) };
      delete copia[chave];
      return { ...prev, [funcionarioId]: copia };
    });
    const { error } = await supa.from("permissoes_excecao")
      .delete()
      .eq("funcionario_id", funcionarioId)
      .eq("chave_permissao", chave);
    if (error) {
      await buscar();
      throw error;
    }
  }
  return { pode, carregando, tabela, excecoes, definirPermissao, definirExcecao, removerExcecao, refetch: buscar };
}

// ─── HIERARQUIA COMERCIAL ──────────────────────────────────────────────────
// Resolve o nível de acesso de um funcionário dentro da nova hierarquia
// (admin_geral > superintendente > diretor > gerente > vendedor).
//
// Compatibilidade: funcionários de teste/legado (cadastrados antes da
// hierarquia existir, ex: FUNCIONARIOS_BASE) não têm `nivel` gravado no
// banco. Para esses, mantemos o comportamento antigo como fallback: quem
// está em ADMIN_EMAILS_FIXO (ver ehAdminFuncionario) vira "admin_geral", o
// resto vira "vendedor" — assim nada quebra para os dados de teste já
// existentes, e todo funcionário migrado via Supabase (com `nivel` já
// definido) passa a usar a hierarquia real automaticamente.
//
// Namespacing administrativo (raiz da colisão corrigida): `funcionarios_
// administrativo` guarda o papel da pessoa na coluna `papel`
// ("gerente"/"coordenador"/"membro"), NUNCA em `nivel` — só
// `funcionarios_comercial` usa `nivel`. Sem tratamento à parte, um
// funcionário administrativo caía no fallback acima (`func?.nivel` vazio)
// e virava "vendedor" ao logar; pior, se algum dia `papel` fosse lido como
// `nivel` em algum outro ponto, "gerente" administrativo e "gerente"
// comercial cairiam na MESMA linha de `permissoes_papel`. Para eliminar a
// colisão na raiz, todo `papel` administrativo é namespaced aqui com o
// prefixo "admin_" (`gerente`→"admin_gerente", `coordenador`→
// "admin_coordenador", `membro`→"admin_membro") antes de virar
// `usuario.nivel` — assim ele nunca mais compartilha chave com os níveis
// comerciais (vendedor/gerente/diretor/superintendente/admin_geral), nem
// em `permissoes_papel` nem em nenhuma comparação `usuario.nivel === "gerente"`
// espalhada pelo app (essas comparações são todas do lado comercial —
// filtrarPorEscopoGestor, isGestor, etc. — e continuam corretas porque
// "admin_gerente" nunca bate com o literal "gerente").
const PAPEL_ADMINISTRATIVO_PARA_NIVEL = {
  gerente: "admin_gerente",
  coordenador: "admin_coordenador",
  membro: "admin_membro"
};
function resolverNivel(func) {
  if (func?.nivel) return func.nivel;
  if (func?.papel && PAPEL_ADMINISTRATIVO_PARA_NIVEL[func.papel]) {
    return PAPEL_ADMINISTRATIVO_PARA_NIVEL[func.papel];
  }
  return ehAdminFuncionario(func) ? "admin_geral" : "vendedor";
}
// Papel legado (admin/funcionario) derivado do nível novo — usado onde o
// código ainda só entende esse binário (ex: `isAdmin`, RLS antiga do front).
// Só "admin_geral" mantém o painel administrativo completo; os demais
// níveis de gestão (superintendente/diretor/gerente) ainda caem em
// "funcionario" por enquanto — telas de gestão dedicadas para eles são o
// próximo passo, feito à parte para manter esta mudança pequena e testável.
function papelLegado(nivel) {
  return nivel === "admin_geral" ? "admin" : "funcionario";
}
// Filtra a lista de funcionários pelo escopo de gestão do usuário logado:
// - gerente vê só sua própria gerência
// - diretor vê toda sua diretoria (inclui vendedores que só têm gerencia_id
//   preenchido — é preciso subir via gerencias.diretoria_id para achá-los,
//   além dos vendedores ligados direto à diretoria sem gerência, ex: Edilene)
// - superintendente vê toda sua superintendência (mesma lógica, subindo mais
//   um nível via diretorias.superintendencia_id)
// - admin_geral/vendedor: sem filtro aqui (admin vê tudo; vendedor não usa
//   esta função, ele nem chega nas telas de gestão)
// `gerencias`/`diretorias` são as listas planas de funcionarios_comercial
// (ver useArvoreComercialData) — usadas só para o join de escopo.
function filtrarPorEscopoGestor(lista, usuario, { gerencias = [], diretorias = [] } = {}) {
  if (!usuario) return lista;
  if (usuario.nivel === "gerente") {
    return lista.filter(f => f.gerencia_id === usuario.gerencia_id);
  }
  if (usuario.nivel === "diretor") {
    const gerenciasDaDiretoria = new Set(gerencias.filter(g => g.diretoria_id === usuario.diretoria_id).map(g => g.id));
    return lista.filter(f => f.diretoria_id === usuario.diretoria_id || gerenciasDaDiretoria.has(f.gerencia_id));
  }
  if (usuario.nivel === "superintendente") {

    }
  });

  // ── 4) Gerências: mesma lógica, chave por diretoria + nome ──────────────
  const gerPorChave = new Map(); // "dirId::NOME" -> gerência existente
  banco.gerencias.forEach(g => gerPorChave.set(`${g.diretoria_id}::${g.nome.trim().toUpperCase()}`, g));
  const gerenciasNovas = new Map();
  linhasComSup.forEach(l => {
    if (!l.diretoriaNome || !l.gerenciaNome) return;
    const sup = resolverSuperintendencia(l);
    const dirChave = `${sup.id}::${l.diretoriaNome.toUpperCase()}`;
    const dirExistente = dirPorChave.get(dirChave);
    // Se a diretoria também é nova neste mesmo plano, ainda não tem id real
    // — a gerência nova associada a ela só pode ser criada depois que a
    // diretoria for criada e o id real for conhecido (resolvido na hora de
    // aplicar, não aqui na análise).
    const gerChaveBusca = dirExistente ? `${dirExistente.id}::${l.gerenciaNome.toUpperCase()}` : null;
    if (gerChaveBusca && gerPorChave.has(gerChaveBusca)) return; // já existe
    // Chave "lógica" (por nome de diretoria, não id) para deduplicar no plano
    const chaveLogica = `${sup.id}::${l.diretoriaNome.toUpperCase()}::${l.gerenciaNome.toUpperCase()}`;
    if (!gerenciasNovas.has(chaveLogica)) {
      gerenciasNovas.set(chaveLogica, {
        chave: chaveLogica,
        nome: l.gerenciaNome,
        responsavel_nome: l.gerenteNome,
        diretoriaNomeRef: l.diretoriaNome,
        superintendenciaIdRef: sup.id
      });
    }
  });

  // ── 5) Funcionários: casamento por matrícula, com fallback por e-mail ───
  const funcPorMatricula = new Map(banco.funcionariosTodos.map(f => [String(f.matricula).trim(), f]));
  const funcPorEmail = new Map(
    banco.funcionariosTodos.filter(f => f.email).map(f => [f.email.trim().toLowerCase(), f])
  );

  const funcionariosNovos = [];
  const funcionariosAtualizados = []; // { id, campos: {...} }
  const matriculasNaPlanilha = new Set();

  linhasComSup.forEach(l => {
    matriculasNaPlanilha.add(l.matricula);
    let existente = funcPorMatricula.get(l.matricula);
    if (!existente && l.email) existente = funcPorEmail.get(l.email);

    const camposBase = {
      matricula: l.matricula,
      nome_completo: l.nomeCompleto,
      apelido: l.apelido,
      email: l.email,
      cpf: l.cpf,
      cargo_origem: l.cargoOrigem,
      nivel: l.nivel,
      vinculo: l.vinculo,
      situacao: "ATIVO"
      // gerencia_id / diretoria_id / superintendencia_id são resolvidos na
      // hora de aplicar (dependem de diretorias/gerências recém-criadas).
    };
    // Remove campos vazios (null) — regra 5: nunca apaga um campo existente
    // por causa de célula vazia na planilha, então numa ATUALIZAÇÃO só
    // entram os campos realmente preenchidos.
    const camposPreenchidos = {};
    Object.entries(camposBase).forEach(([k, v]) => { if (v !== null && v !== "") camposPreenchidos[k] = v; });

    const sup = resolverSuperintendencia(l);
    const refs = {
      _superintendenciaId: sup ? sup.id : null,
      _diretoriaNome: l.diretoriaNome || null,
      _gerenciaNome: l.gerenciaNome || null
    };

    if (existente) {
      funcionariosAtualizados.push({
        id: existente.id,
        matriculaAnterior: existente.matricula,
        matriculaMudou: String(existente.matricula).trim() !== l.matricula,
        nome: l.nomeCompleto,
        campos: existente.situacao !== "ATIVO" ? { ...camposPreenchidos, situacao: "ATIVO" } : camposPreenchidos,
        ...refs
      });
    } else {
      funcionariosNovos.push({
        ...camposBase,
        apelido: l.apelido, email: l.email, cpf: l.cpf, cargo_origem: l.cargoOrigem,
        // 'modalidade' não vem do Excel (não existe no mapa de colunas do
        // importador) mas a coluna é NOT NULL no banco — sem esse default,
        // todo funcionário novo falha no insert com erro de constraint.
        modalidade: "presencial",
        ...refs
      });
    }
  });

  // Quem sumiu da planilha (existia ativo no banco, matrícula não apareceu
  // desta vez) — marca inativo, nunca deleta.
  // IMPORTANTE: a comparação só pode valer dentro do escopo REAL da
  // planilha, e esse escopo precisa ser calculado no nível MAIS ESPECÍFICO
  // possível — gerência, senão diretoria, senão superintendência. Se
  // sempre usássemos superintendência (nível mais amplo), importar uma
  // planilha com um único funcionário (ex.: só a Lara Reis, de uma
  // gerência) faria o sistema achar que TODOS os outros da mesma
  // superintendência "sumiram" e inativaria a superintendência inteira por
  // engano — mesmo planilhas de uma gerência só, ou de uma diretoria só,
  // devem inativar apenas dentro desse escopo mais estreito.
  // Resolve a superintendência/diretoria/gerência REAIS de um funcionário
  // do banco. A maioria (vendedores/gerentes) não tem `superintendencia_id`
  // nem `diretoria_id` preenchidos direto na tabela — só o superintendente
  // e o diretor, respectivamente. O vínculo verdadeiro passa por
  // gerencia_id → diretoria_id → superintendencia_id (mesma cadeia usada em
  // toda consulta correta ao banco).
  const gerenciaPorId = new Map(banco.gerencias.map(g => [g.id, g]));
  const diretoriaPorId = new Map(banco.diretorias.map(d => [d.id, d]));
  function resolverDiretoriaIdDoFuncionario(f) {
    return f.diretoria_id ?? gerenciaPorId.get(f.gerencia_id)?.diretoria_id ?? null;
  }
  function resolverSuperintendenciaIdDoFuncionario(f) {
    if (f.superintendencia_id != null) return f.superintendencia_id;
    return diretoriaPorId.get(resolverDiretoriaIdDoFuncionario(f))?.superintendencia_id ?? null;
  }

  // Resolve a diretoria e a gerência REAIS (ids existentes no banco) que uma
  // linha da planilha referencia — usado só para montar o escopo, não para
  // gravar (a criação de diretoria/gerência nova continua acontecendo na
  // hora de aplicar). Diretoria/gerência novas (ainda sem id) não entram
  // no escopo por id — mas isso é seguro, pois nesse caso ninguém no banco
  // pode pertencer a algo que ainda não existe.
  function resolverDiretoriaIdDaLinha(l) {
    if (!l.diretoriaNome) return null;
    const sup = resolverSuperintendencia(l);
    if (!sup) return null;
    return dirPorChave.get(`${sup.id}::${l.diretoriaNome.toUpperCase()}`)?.id ?? null;
  }
  function resolverGerenciaIdDaLinha(l) {
    if (!l.gerenciaNome) return null;
    const dirId = resolverDiretoriaIdDaLinha(l);
    if (dirId == null) return null;
    return gerPorChave.get(`${dirId}::${l.gerenciaNome.toUpperCase()}`)?.id ?? null;
  }

  // Três conjuntos de escopo, do mais específico para o mais amplo.
  const gerenciaIdsNaPlanilha = new Set(
    linhasComSup.map(l => resolverGerenciaIdDaLinha(l)).filter(id => id != null)
  );
  const diretoriaIdsNaPlanilha = new Set(
    linhasComSup.map(l => resolverDiretoriaIdDaLinha(l)).filter(id => id != null)
  );
  const superintendenciaIdsNaPlanilha = new Set(
    linhasComSup.map(l => resolverSuperintendencia(l)).filter(Boolean).map(s => s.id)
  );

  // Uma linha "cobre a diretoria inteira" quando ela não tem gerência (ex.:
  // a linha do próprio diretor) — sinal de que aquela pessoa está acima do
  // nível de gerência dentro da diretoria. Da mesma forma, uma linha "cobre
  // a superintendência inteira" quando não tem diretoria (linha do próprio
  // superintendente). Usamos isso para saber se a planilha só tocou
  // diretorias/gerências específicas (import parcial) ou trouxe o nível
  // acima também (import mais amplo, incluindo o responsável daquele nível).
  const diretoriaIdsCobertasPorCompleto = new Set(
    linhasComSup.filter(l => l.diretoriaNome && !l.gerenciaNome)
      .map(l => resolverDiretoriaIdDaLinha(l)).filter(id => id != null)
  );
  const superintendenciaIdsCobertasPorCompleto = new Set(
    linhasComSup.filter(l => !l.diretoriaNome)
      .map(l => resolverSuperintendencia(l)).filter(Boolean).map(s => s.id)
  );

  // Um funcionário do banco só entra na comparação de "sumiu" se o escopo
  // dele foi efetivamente tocado pela planilha, no nível mais específico
  // disponível: se a gerência dele aparece na planilha, compara só dentro
  // dessa gerência; senão, se a diretoria dele aparece (como diretoria
  // citada OU coberta por completo), compara dentro da diretoria; senão,
  // cai para superintendência — mas só se a planilha realmente cobriu a
  // superintendência por completo (não apenas uma diretoria/gerência
  // isolada dela). Isso vale também para quem está no topo de cada nível
  // (o diretor não tem gerencia_id; o superintendente não tem
  // diretoria_id nem gerencia_id) — sem esse cuidado, importar só a
  // diretoria da Lara Reis fazia o sistema tratar a superintendente Simone
  // Lago como "fora do escopo mais específico" e cair direto no escopo de
  // superintendência, inativando-a por engano.
  function funcionarioEstaNoEscopoDaPlanilha(f) {
    if (f.gerencia_id != null) {
      if (gerenciaIdsNaPlanilha.has(f.gerencia_id)) return true;
      // A gerência dele existe mas não é nenhuma das que a planilha citou.
      // Só ainda é candidato a "sumiu" se a planilha nem chegou a filtrar
      // por gerência dentro da diretoria dele (planilha genérica); se a
      // planilha listou gerências específicas daquela diretoria e a dele
      // não está entre elas, ele está fora do escopo importado e não deve
      // ser tocado.
      const dirId = resolverDiretoriaIdDoFuncionario(f);
      const planilhaFiltrouGerenciasDestaDiretoria = [...gerenciaIdsNaPlanilha].some(
        gid => gerenciaPorId.get(gid)?.diretoria_id === dirId
      );
      if (planilhaFiltrouGerenciasDestaDiretoria) return false;
    }
    const dirId = resolverDiretoriaIdDoFuncionario(f);
    if (dirId != null) {
      if (diretoriaIdsNaPlanilha.has(dirId) || diretoriaIdsCobertasPorCompleto.has(dirId)) return true;
      const supId = diretoriaPorId.get(dirId)?.superintendencia_id;
      const planilhaFiltrouDiretoriasDestaSup = [...diretoriaIdsNaPlanilha].some(
        did => diretoriaPorId.get(did)?.superintendencia_id === supId
      );
      if (planilhaFiltrouDiretoriasDestaSup) return false;
    }
    const supId = resolverSuperintendenciaIdDoFuncionario(f);
    return superintendenciaIdsCobertasPorCompleto.has(supId);
  }

  const funcionariosInativados = banco.funcionariosTodos.filter(f =>
    (f.situacao || "ATIVO").toUpperCase() === "ATIVO" &&
    funcionarioEstaNoEscopoDaPlanilha(f) &&
    !matriculasNaPlanilha.has(String(f.matricula).trim())
  ).filter(f => {
    // Se o funcionário foi "recasado" por e-mail em alguma linha da
    // planilha (matrícula mudou), ele não deve ser tratado como inativado
    // — já foi contemplado como atualização acima.
    const foiRecasadoPorEmail = funcionariosAtualizados.some(a => a.id === f.id);
    return !foiRecasadoPorEmail;
  });

  return {
    erros,
    totalLinhasPlanilha: linhasExcel.length,
    superintendenciasNaoEncontradas: [...superintendenciasNaoEncontradas],
    diretoriasNovas: [...diretoriasNovas.values()],
    gerenciasNovas: [...gerenciasNovas.values()],
    funcionariosNovos,
    funcionariosAtualizados,
    funcionariosInativados
  };
}

// Aplica as escolhas do usuário na tela de resumo (checkboxes desmarcados
// para diretorias/gerências novas que ele não quer criar — ex.: erro de
// digitação na planilha, como "CARCANJO" em vez do nome correto). Remove do
// plano a diretoria/gerência rejeitada e qualquer funcionário (novo ou
// atualizado) que dependa dela, devolvendo um novo objeto de plano — não
// modifica o original, para a UI poder re-filtrar se o usuário mudar de
// ideia antes de confirmar.
// diretoriasRejeitadas / gerenciasRejeitadas: Set das `chave` (ver campo
// `chave` em diretoriasNovas/gerenciasNovas) que o usuário desmarcou.
function filtrarPlanoPorSelecao(plano, diretoriasRejeitadas, gerenciasRejeitadas) {
  if (diretoriasRejeitadas.size === 0 && gerenciasRejeitadas.size === 0) return plano;

  const dirNomesRejeitados = new Set(
    plano.diretoriasNovas.filter(d => diretoriasRejeitadas.has(d.chave)).map(d => d.nome.toUpperCase())
  );
  // Uma gerência é excluída se foi desmarcada diretamente OU se pertence a
  // uma diretoria que foi rejeitada (não faz sentido criar a gerência sem a
  // diretoria que ela referencia).
  const gerenciasNovas = plano.gerenciasNovas.filter(g =>
    !gerenciasRejeitadas.has(g.chave) && !dirNomesRejeitados.has(g.diretoriaNomeRef.toUpperCase())
  );
  const gerNomesRejeitados = new Set(
    plano.gerenciasNovas
      .filter(g => gerenciasRejeitadas.has(g.chave) || dirNomesRejeitados.has(g.diretoriaNomeRef.toUpperCase()))
      .map(g => `${g.diretoriaNomeRef.toUpperCase()}::${g.nome.toUpperCase()}`)
  );

  // Uma pessoa (nova ou atualizada) fica de fora desta rodada se sua
  // diretoria ou gerência de destino foi rejeitada. Não é erro — apenas não
  // é tocada, mantendo o estado atual dela no banco (se já existir).
  const dependeDeRejeitado = item => {
    if (item._diretoriaNome && dirNomesRejeitados.has(item._diretoriaNome.toUpperCase())) return true;
    if (item._diretoriaNome && item._gerenciaNome &&
        gerNomesRejeitados.has(`${item._diretoriaNome.toUpperCase()}::${item._gerenciaNome.toUpperCase()}`)) return true;
    return false;
  };

  return {
    ...plano,
    diretoriasNovas: plano.diretoriasNovas.filter(d => !diretoriasRejeitadas.has(d.chave)),
    gerenciasNovas,
    funcionariosNovos: plano.funcionariosNovos.filter(f => !dependeDeRejeitado(f)),
    funcionariosAtualizados: plano.funcionariosAtualizados.filter(f => !dependeDeRejeitado(f))
  };
}

// Aplica um plano já analisado (ver analisarImportacaoHierarquia) no
// Supabase. Ordem importa: diretorias antes de gerências (gerência precisa
// do id real da diretoria), e ambas antes dos funcionários (que precisam
// dos ids de gerência/diretoria/superintendência para gravar as FKs).
// onProgresso(etapa) é opcional, só para feedback textual no modal.
// Chama a Edge Function do painel de acessos (admin-gerenciar-acesso) com o
// token real da sessão logada — a function exige isso no servidor e rejeita
// qualquer chamada sem um token válido de gre@portovale.com.br (ver
// comentário de segurança na própria function). Retorna { ok, ...resto } ou
// { ok: false, erro }.
// - acao: "resetar_senha" | "revogar_acesso" | "reativar_acesso"
// - funcionario: registro de funcionarios_comercial (precisa de auth_user_id e id)
// - origem: "manual" (padrão, ação disparada pelo modal de perfil) ou
//   "importacao_planilha" (auto-revogação/reativação rodada durante a
//   importação) — só usado para o log de auditoria, não muda o comportamento.
// - acao: "resetar_senha" | "revogar_acesso" | "reativar_acesso"
// - funcionario: registro de funcionarios_comercial OU funcionarios_administrativo
//   (precisa de auth_user_id e id; nome vem de nome_completo ou nome,
//   dependendo da origem — ver comentário abaixo)
// - origem: "manual" (padrão, ação disparada pelo modal de perfil) ou
//   "importacao_planilha" (auto-revogação/reativação rodada durante a
//   importação) — só usado para o log de auditoria, não muda o comportamento.
//
// Table-agnostic desde [namespacing admin_*]: antes só mandava
// `funcionario_comercial_id`, hardcoded — se algum dia fosse chamada com um
// registro administrativo (que não tem esse campo, só `id` + `papel`), a
// Edge Function receberia `funcionario_comercial_id: <id administrativo>`,
// contaminando a FK errada em log_acessos/funcionarios_comercial. Hoje só é
// chamada com registros comerciais (ModalPerfilComercial,
// aplicarImportacaoHierarquia), então isso nunca disparou na prática — mas
// deixamos a função segura por construção, já pronta para quando o modal de
// perfil administrativo existir. IMPORTANTE: a Edge Function
// admin-gerenciar-acesso (server-side, fora deste arquivo) hoje só lê
// `funcionario_comercial_id` do payload — precisa ser atualizada para
// também aceitar/gravar `funcionario_administrativo_id` antes desta função
// ser chamada com origem administrativa, senão o vínculo em log_acessos sai
// vazio do mesmo jeito que o de criarUsuariosAdminEmLote saía antes da
// correção em registrarLogAcessosClient.
async function chamarGerenciarAcesso(acao, funcionario, origem) {
  if (!funcionario.auth_user_id) {
    // Sem login criado ainda — não há usuário Auth para agir sobre. Não é
    // erro: só não há nada a fazer no Auth (a situacao/acesso_revogado no
    // banco continua valendo normalmente).
    return { ok: true, semAuthUser: true };
  }
  // `origemComercial: true` (funcionarios_comercial normalizado) ou a
  // presença de `nome_completo`/ausência de `papel` identifica comercial;
  // qualquer outro caso (tem `papel`, sem nome_completo) é administrativo.
  // Mesma heurística usada em `nomeParaLog`.
  const ehAdministrativo = !funcionario.nome_completo && (funcionario.papel != null || funcionario.nome != null);
  try {
    const { data: sessao } = await supa.auth.getSession();
    const token = sessao?.session?.access_token;
    if (!token) return { ok: false, erro: "Sessão expirada — faça login novamente." };
    const res = await fetch(EDGE_GERENCIAR_ACESSO, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({
        acao,
        auth_user_id: funcionario.auth_user_id,
        funcionario_comercial_id: ehAdministrativo ? null : funcionario.id,
        funcionario_administrativo_id: ehAdministrativo ? funcionario.id : null,
        funcionario_nome: funcionario.nome_completo || funcionario.nome || null,
        funcionario_matricula: funcionario.matricula || null,
        origem: origem || "manual"
      })
    });
    const json = await res.json();
    if (!res.ok || json.erro) return { ok: false, erro: json.erro || `Falha (HTTP ${res.status}).` };
    return { ok: true, ...json };
  } catch (e) {
    return { ok: false, erro: "Não foi possível contatar a Edge Function. Verifique se ela está publicada." };
  }
}

// Cria um login individual para uma linha de uma tabela permitida
// (funcionarios_comercial ou funcionarios_administrativo). Table-agnostic
// de verdade — diferente de EDGE_CRIAR_USUARIO (legado, só funcionarios).
async function chamarCriarUsuarioIndividual(tabela, id) {
  try {
    const res = await fetch(EDGE_CRIAR_USUARIO_INDIVIDUAL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPA_KEY, "Authorization": `Bearer ${SUPA_KEY}` },
      body: JSON.stringify({ tabela, id })
    });
    const json = await res.json();
    if (!res.ok || !json.ok) return { ok: false, erro: json.erro || `Falha (HTTP ${res.status}).` };
    return json;
  } catch (e) {
    return { ok: false, erro: "Não foi possível contatar a Edge Function. Verifique se ela está publicada." };
  }
}


// Nome para mensagens de log/erro da importação — mais simples que
// calcularNomesExibicao (sem desambiguação por 2/3/4 nomes): usa o apelido
// quando existe, senão o nome completo. Suficiente aqui porque essas
// mensagens sempre vêm acompanhadas da matrícula, que já é inequívoca.
function nomeParaLog(f) {
  return (f.apelido && String(f.apelido).trim()) ? String(f.apelido).trim().toUpperCase() : (f.nome_completo || f.nome || "");
}
async function aplicarImportacaoHierarquia(plano, banco, onProgresso) {
  const progresso = onProgresso || (() => {});

  // ── 1) Cria diretorias novas ─────────────────────────────────────────────
  progresso("Criando diretorias novas…");
  const dirPorChave = new Map(); // "supId::NOME" -> registro (existente ou recém-criado)
  banco.diretorias.forEach(d => dirPorChave.set(`${d.superintendencia_id}::${d.nome.trim().toUpperCase()}`, d));
  for (const nova of plano.diretoriasNovas) {
    const { data, error } = await supa.from("diretorias")
      .insert({ nome: nova.nome, responsavel_nome: nova.responsavel_nome, superintendencia_id: nova.superintendencia_id })
      .select().single();
    if (error) throw new Error(`Falha ao criar diretoria "${nova.nome}": ${extrairMensagemErro(error)}`);
    dirPorChave.set(`${nova.superintendencia_id}::${nova.nome.trim().toUpperCase()}`, data);
    registrarLogAcessosClient({
      acao: "estrutura_criada",
      origem: "importacao_planilha",
      detalhe: { tipo: "diretoria", nome: nova.nome }
    });
  }

  // ── 2) Cria gerências novas (usando ids reais de diretoria, inclusive as
  //      recém-criadas no passo anterior) ─────────────────────────────────
  progresso("Criando gerências novas…");
  const gerPorChave = new Map(); // "dirId::NOME" -> registro
  banco.gerencias.forEach(g => gerPorChave.set(`${g.diretoria_id}::${g.nome.trim().toUpperCase()}`, g));
  for (const nova of plano.gerenciasNovas) {
    const dir = dirPorChave.get(`${nova.superintendenciaIdRef}::${nova.diretoriaNomeRef.toUpperCase()}`);
    if (!dir) throw new Error(`Diretoria "${nova.diretoriaNomeRef}" não encontrada ao criar gerência "${nova.nome}".`);
    const { data, error } = await supa.from("gerencias")
      .insert({ nome: nova.nome, responsavel_nome: nova.responsavel_nome, diretoria_id: dir.id })
      .select().single();
    if (error) throw new Error(`Falha ao criar gerência "${nova.nome}": ${extrairMensagemErro(error)}`);
    gerPorChave.set(`${dir.id}::${nova.nome.trim().toUpperCase()}`, data);
    registrarLogAcessosClient({
      acao: "estrutura_criada",
      origem: "importacao_planilha",
      detalhe: { tipo: "gerencia", nome: nova.nome, pai: dir.nome }
    });
  }

  // Resolve superintendencia_id/diretoria_id/gerencia_id de um item de
  // funcionário (novo ou atualizado). O id de superintendência já vem
  // resolvido desde a fase de análise (inclusive via fallback por
  // responsável); aqui só resta achar diretoria/gerência pelo nome + esse id.
  function resolverIds(item) {
    const supId = item._superintendenciaId;
    const ids = { superintendencia_id: supId, diretoria_id: null, gerencia_id: null };
    if (item._diretoriaNome && supId != null) {
      const dir = dirPorChave.get(`${supId}::${item._diretoriaNome.toUpperCase()}`);
      ids.diretoria_id = dir ? dir.id : null;
      if (item._gerenciaNome && dir) {
        const ger = gerPorChave.get(`${dir.id}::${item._gerenciaNome.toUpperCase()}`);
        ids.gerencia_id = ger ? ger.id : null;
      }
    }
    return ids;
  }

  // ── 3) Cria funcionários novos ───────────────────────────────────────────
  progresso(`Criando ${plano.funcionariosNovos.length} funcionário(s) novo(s)…`);
  for (const novo of plano.funcionariosNovos) {
    const { _superintendenciaId, _diretoriaNome, _gerenciaNome, ...campos } = novo;
    const ids = resolverIds(novo);
    const { data, error } = await supa.from("funcionarios_comercial")
      .insert({ ...campos, ...ids })
      .select().single();
    if (error) throw new Error(`Falha ao criar funcionário "${nomeParaLog(novo)}" (matrícula ${novo.matricula}): ${extrairMensagemErro(error)}`);
    registrarLogAcessosClient({
      acao: "criar_funcionario",
      funcionario_comercial_id: data?.id,
      funcionario_nome: nomeParaLog(novo),
      funcionario_matricula: novo.matricula,
      origem: "importacao_planilha",
      detalhe: {
        superintendencia: novo._superintendenciaId ? banco.superintendencias?.find(s => s.id === novo._superintendenciaId)?.nome : null,
        diretoria: _diretoriaNome || null,
        gerencia: _gerenciaNome || null
      }
    });
  }

  // ── 4) Atualiza funcionários existentes ─────────────────────────────────
  progresso(`Atualizando ${plano.funcionariosAtualizados.length} funcionário(s)…`);
  for (const at of plano.funcionariosAtualizados) {
    const ids = resolverIds(at);
    const novoNivel = at.campos?.nivel; // presente sempre que a linha trouxe cargo — regra 5 não remove esse campo
    // Sobrescreve os ids de hierarquia quando eles puderam ser resolvidos a
    // partir da planilha — evita zerar um vínculo válido só porque um nome
    // ficou momentaneamente não encontrado (não deveria ocorrer, já que
    // diretorias/gerências novas são criadas antes deste passo).
    const idsResolvidos = {};
    if (ids.superintendencia_id != null) idsResolvidos.superintendencia_id = ids.superintendencia_id;
    if (at._diretoriaNome) { if (ids.diretoria_id != null) idsResolvidos.diretoria_id = ids.diretoria_id; }
    if (at._gerenciaNome) { if (ids.gerencia_id != null) idsResolvidos.gerencia_id = ids.gerencia_id; }
    // Além de preencher o que veio na planilha, zera explicitamente os
    // vínculos que o NOVO nível não usa mais — sem isso, uma promoção ou
    // despromoção (ex.: gerente virando diretor, diretor virando gerente)
    // podia deixar gerencia_id/diretoria_id "sujos" de quando a pessoa
    // ocupava o nível anterior, já que a planilha normalmente não traz mais
    // esses nomes para o cargo novo (regra 5 nunca apagaria isso sozinha).
    // Só entra em ação quando o nível é conhecido nesta importação — sem
    // isso, uma linha sem coluna de cargo não deveria mexer em vínculos.
    if (novoNivel) {
      if (novoNivel === "superintendente") {
        idsResolvidos.diretoria_id = null;
        idsResolvidos.gerencia_id = null;
      } else if (novoNivel === "diretor") {
        idsResolvidos.gerencia_id = null;
      }
      // gerente e vendedor podem legitimamente ter diretoria_id/gerencia_id
      // (vendedor pode estar vinculado direto à diretoria, sem gerência) —
      // nesses casos os valores já resolvidos ou omitidos acima prevalecem.
    }
    const { error } = await supa.from("funcionarios_comercial")
      .update({ ...at.campos, ...idsResolvidos })
      .eq("id", at.id);
    if (error) throw new Error(`Falha ao atualizar funcionário "${at.nome}": ${extrairMensagemErro(error)}`);
  }

  // ── 5) Inativa quem sumiu da planilha ────────────────────────────────────
  // Além de marcar situacao=INATIVO (já existia), agora também revoga o
  // acesso de login (Auth) de quem tinha auth_user_id — via a mesma Edge
  // Function do painel de acessos, com o mesmo efeito do botão manual
  // "Revogar acesso": bane o usuário no Auth e marca acesso_revogado=true
  // em funcionarios_comercial. Feito depois do update de situacao (não
  // bloqueia a inativação em si se a Edge Function falhar) — falhas aqui
  // ficam registradas em `falhasRevogacao` e são reportadas ao usuário no
  // resumo, mas não interrompem a importação.
  progresso(`Inativando ${plano.funcionariosInativados.length} funcionário(s)…`);
  const falhasRevogacao = [];
  const idsInativadosAgora = new Set();
  for (const inativo of plano.funcionariosInativados) {
    const { error } = await supa.from("funcionarios_comercial")
      .update({ situacao: "INATIVO" })
      .eq("id", inativo.id);
    if (error) throw new Error(`Falha ao inativar funcionário "${nomeParaLog(inativo)}": ${extrairMensagemErro(error)}`);
    idsInativadosAgora.add(inativo.id);
    if (inativo.auth_user_id) {
      const resultado = await chamarGerenciarAcesso("revogar_acesso", inativo, "importacao_planilha");
      if (!resultado.ok) {
        falhasRevogacao.push({ nome: nomeParaLog(inativo), matricula: inativo.matricula, motivo: resultado.erro });
      }
    }
  }

  // ── 6) Revoga acesso de quem JÁ estava inativado antes desta importação
  //      (não faz parte de `funcionariosInativados` acima, que só pega quem
  //      acabou de virar inativo agora) mas ainda tem login com
  //      acesso_revogado=false — situação "órfã" que podia ficar assim para
  //      sempre em importações anteriores a esta correção, ou por falhas
  //      antigas em falhasRevogacao que nunca foram reprocessadas. Cobre
  //      todo o banco (banco.funcionariosTodos), não só o escopo/
  //      superintendência desta planilha, já que aqui não há criação de
  //      dados novos — só corrigir um estado que ficou pendente.
  const jaEramInativosComAcessoPendente = banco.funcionariosTodos.filter(f =>
    (f.situacao || "ATIVO").toUpperCase() === "INATIVO" &&
    !idsInativadosAgora.has(f.id) &&
    f.auth_user_id &&
    !f.acesso_revogado
  );
  if (jaEramInativosComAcessoPendente.length > 0) {
    progresso(`Revogando acesso de ${jaEramInativosComAcessoPendente.length} funcionário(s) já inativado(s) anteriormente…`);
    for (const f of jaEramInativosComAcessoPendente) {
      const resultado = await chamarGerenciarAcesso("revogar_acesso", f, "importacao_planilha");
      if (!resultado.ok) {
        falhasRevogacao.push({ nome: nomeParaLog(f), matricula: f.matricula, motivo: resultado.erro });
      }
    }
  }

  progresso("Concluído.");
  return { falhasRevogacao, revogadosRetroativos: jaEramInativosComAcessoPendente.map(f => ({ nome: nomeParaLog(f), matricula: f.matricula })) };
}

// ─── IMPORTADOR DE EQUIPE ADMINISTRATIVA ──────────────────────────────────
// Lê uma planilha do administrativo (modelo "gre1.xlsx": Matricula,
// Colaborador, Cargo, Area, Situacao, Supervisor, Supervisao, e-mail
// Profissional) e sincroniza funcionarios_administrativo. Diferente do
// comercial, aqui não existem tabelas de estrutura separadas — a hierarquia
// (equipe > coordenador > subequipe > membro) vive inteira dentro de
// funcionarios_administrativo, em três colunas: equipe_id (texto livre,
// nome da equipe), subequipe_id (texto livre, nome da subequipe) e
// coordenador_id (uuid, aponta para outro funcionario_administrativo).
//
// Identificação de papéis, tudo pelo CARGO da planilha (decisão do Arthur):
//  - "GERENTE ADMINISTRATIVO..." -> gerente da equipe inteira (sem
//    coordenador acima, sem subequipe).
//  - "COORDENADOR ADMINISTRATIVO..." -> lidera uma ou mais subequipes (sem
//    subequipe própria, coordenador_id aponta pro gerente).
//  - Qualquer outro cargo -> membro comum: subequipe_id vem da coluna
//    "Supervisao" da própria linha; coordenador_id é resolvido casando o
//    nome da coluna "Supervisor" com os coordenadores já identificados.
//
// Nome da equipe: por padrão vem do nome do arquivo importado (sem
// extensão, maiúsculo). Se esse nome não bater com nenhuma equipe já
// existente, tenta reconhecer por similaridade de funcionários (matrículas
// em comum) antes de assumir que é uma equipe nova — evita duplicar a
// mesma equipe só porque o arquivo trocou de nome entre importações.

const MAPA_COLUNAS_IMPORT_ADMIN = {
  matricula: "Matricula",
  nome: "Colaborador",
  cargo: "Cargo",
  setor: "Area",
  situacao: "Situacao",
  supervisor: "Supervisor",
  supervisao: "Supervisao",
  email: "e-mail Profissional"
};

// Extrai o nome da equipe a partir do nome do arquivo: remove a extensão,
// troca separadores comuns (_, -, .) por espaço, colapsa espaços e
// maiuscula — "gre1.xlsx" -> "GRE1", "equipe_financeiro.xlsx" -> "EQUIPE
// FINANCEIRO".
function nomeEquipeDoArquivo(nomeArquivo) {
  const semExtensao = String(nomeArquivo || "").replace(/\.[^.]+$/, "");
  const espacado = semExtensao.replace(/[_\-.]+/g, " ").trim();
  return (espacado || "EQUIPE SEM NOME").toUpperCase();
}

function classificarCargoAdmin(cargoBruto) {
  const cargo = String(cargoBruto || "").trim().toUpperCase();
  if (cargo.includes("GERENTE")) return "gerente";
  if (cargo.includes("COORDENADOR")) return "coordenador";
  return "membro";
}

// Compara um nome "curto" (ex.: coluna Supervisor, que às vezes vem
// abreviado, tipo "FELIPE ALBACETE") contra um nome completo (ex.: "FELIPE
// ROSA ALBACETE RAMOS" do cadastro do coordenador). Considera correspondência
// quando todas as palavras do nome curto aparecem, na mesma ordem relativa,
// dentro do nome completo — não exige que sejam vizinhas, já que sobrenomes
// do meio (ROSA, DE ALMEIDA) costumam ser omitidos na planilha.
function nomeCurtoCasaComCompleto(nomeCurtoBruto, nomeCompletoBruto) {
  const normalizar = s => String(s || "").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const curto = normalizar(nomeCurtoBruto).split(/\s+/).filter(Boolean);
  const completo = normalizar(nomeCompletoBruto).split(/\s+/).filter(Boolean);
  if (curto.length === 0 || completo.length === 0) return false;
  let cursor = 0;
  for (const palavra of curto) {
    const idx = completo.indexOf(palavra, cursor);
    if (idx === -1) return false;
    cursor = idx + 1;
  }
  return true;
}

// Decide a equipe de destino: (1) se algum funcionário já cadastrado tem
// equipe_id igual ao nome derivado do arquivo, usa essa equipe direto; (2)
// senão, compara a lista de matrículas da planilha contra as equipes já
// existentes — se uma equipe existente compartilha uma fração alta de
// matrículas com a planilha nova, assume que é a mesma equipe (arquivo só
// mudou de nome) e devolve o nome JÁ CADASTRADO dessa equipe, em vez do
// nome novo do arquivo; (3) senão, é equipe nova mesmo, usa o nome do
// arquivo.
// Limiar de 50%: decisão prática para equilibrar entre reconhecer a mesma
// equipe reimportada (normalmente quase 100% de sobreposição) e não
// fundir por engano duas equipes pequenas e coincidentes por acaso.
const LIMIAR_SIMILARIDADE_EQUIPE = 0.5;
function resolverNomeEquipe(nomeArquivo, matriculasDaPlanilha, funcionariosExistentes) {
  const nomeCandidato = nomeEquipeDoArquivo(nomeArquivo);
  const equipesExistentes = new Map(); // nome equipe -> Set de matrículas
  for (const f of funcionariosExistentes) {
    if (!f.equipe_id) continue;
    if (!equipesExistentes.has(f.equipe_id)) equipesExistentes.set(f.equipe_id, new Set());
    equipesExistentes.get(f.equipe_id).add(String(f.matricula || "").trim());
  }
  if (equipesExistentes.has(nomeCandidato)) {
    return { nomeEquipe: nomeCandidato, equipeReconhecida: true, equipeNova: false };
  }
  let melhorNome = null;
  let melhorTaxa = 0;
  for (const [nomeEquipe, matriculasEquipe] of equipesExistentes) {
    let emComum = 0;
    for (const m of matriculasDaPlanilha) if (matriculasEquipe.has(m)) emComum++;
    const taxa = matriculasEquipe.size > 0 ? emComum / matriculasEquipe.size : 0;
    if (taxa > melhorTaxa) {
      melhorTaxa = taxa;
      melhorNome = nomeEquipe;
    }
  }
  if (melhorNome && melhorTaxa >= LIMIAR_SIMILARIDADE_EQUIPE) {
    return { nomeEquipe: melhorNome, equipeReconhecida: true, equipeNova: false, taxaSimilaridade: melhorTaxa, nomeArquivoOriginal: nomeCandidato };
  }
  return { nomeEquipe: nomeCandidato, equipeReconhecida: false, equipeNova: true };
}

// Monta o plano de sincronização a partir das linhas cruas do Excel + nome
// do arquivo + funcionários já existentes no administrativo (todos, ativos
// e inativos — mesmo motivo do importador comercial: o diff de inativação
// não pode reprocessar quem já está inativo). Não faz nenhuma chamada de
// rede.
function analisarImportacaoAdministrativa(linhasExcel, nomeArquivo, funcionariosExistentesTodos) {
  const erros = [];
  const linhasValidas = [];

  linhasExcel.forEach((linha, idx) => {
    const numeroLinha = idx + 2;
    const matricula = normalizarTextoHierarquia(linha[MAPA_COLUNAS_IMPORT_ADMIN.matricula]);
    const nomeCompleto = normalizarTextoHierarquia(linha[MAPA_COLUNAS_IMPORT_ADMIN.nome]);
    if (!matricula || !nomeCompleto) {
      erros.push({ linha: numeroLinha, motivo: "Matrícula ou nome do colaborador ausente." });
      return;
    }
    const cargoBruto = normalizarTextoHierarquia(linha[MAPA_COLUNAS_IMPORT_ADMIN.cargo]);
    linhasValidas.push({
      numeroLinha,
      matricula,
      nomeCompleto: nomeCompleto.toUpperCase(),
      cargo: cargoBruto || null,
      papel: classificarCargoAdmin(cargoBruto),
      setor: normalizarTextoHierarquia(linha[MAPA_COLUNAS_IMPORT_ADMIN.setor]) || null,
      situacao: (normalizarTextoHierarquia(linha[MAPA_COLUNAS_IMPORT_ADMIN.situacao]).toUpperCase() || "ATIVO"),
      supervisorNome: normalizarTextoHierarquia(linha[MAPA_COLUNAS_IMPORT_ADMIN.supervisor]) || null,
      supervisaoNome: normalizarTextoHierarquia(linha[MAPA_COLUNAS_IMPORT_ADMIN.supervisao]).toUpperCase() || null,
      email: normalizarTextoHierarquia(linha[MAPA_COLUNAS_IMPORT_ADMIN.email]).toLowerCase() || null
    });
  });

  const matriculasDaPlanilha = new Set(linhasValidas.map(l => l.matricula));
  const { nomeEquipe, equipeReconhecida, equipeNova, taxaSimilaridade, nomeArquivoOriginal } =
    resolverNomeEquipe(nomeArquivo, matriculasDaPlanilha, funcionariosExistentesTodos);

  // Gerente da equipe: só faz sentido haver um; se a planilha trouxer mais
  // de um, o primeiro encontrado vira o gerente e os demais viram erro (não
  // silenciosamente ignorados) — situação anômala que merece revisão manual.
  const gerentesNaPlanilha = linhasValidas.filter(l => l.papel === "gerente");
  if (gerentesNaPlanilha.length > 1) {
    for (const g of gerentesNaPlanilha.slice(1)) {
      erros.push({ linha: g.numeroLinha, matricula: g.matricula, nome: g.nomeCompleto, motivo: `Cargo indica gerente, mas já há um gerente identificado nesta planilha (${gerentesNaPlanilha[0].nomeCompleto}). Revise manualmente.` });
    }
  }
  const gerente = gerentesNaPlanilha[0] || null;
  const coordenadoresNaPlanilha = linhasValidas.filter(l => l.papel === "coordenador");

  // Resolve, para cada membro comum, qual coordenador (da própria
  // planilha) corresponde ao nome da coluna Supervisor.
  function resolverCoordenadorDaLinha(l) {
    if (!l.supervisorNome) return null;
    const achado = coordenadoresNaPlanilha.find(c => nomeCurtoCasaComCompleto(l.supervisorNome, c.nomeCompleto));
    return achado || null;
  }

  const semCoordenadorResolvido = [];
  linhasValidas.forEach(l => {
    if (l.papel !== "membro") return;
    const coord = resolverCoordenadorDaLinha(l);
    if (!coord && l.supervisorNome) semCoordenadorResolvido.push({ linha: l.numeroLinha, matricula: l.matricula, nome: l.nomeCompleto, supervisorBuscado: l.supervisorNome });
  });

  // Casamento com o banco: por matrícula, com fallback por e-mail — mesmo
  // padrão do importador comercial.
  const funcPorMatricula = new Map(funcionariosExistentesTodos.map(f => [String(f.matricula || "").trim(), f]));
  const funcPorEmail = new Map(funcionariosExistentesTodos.filter(f => f.email).map(f => [f.email.trim().toLowerCase(), f]));

  const funcionariosNovos = [];
  const funcionariosAtualizados = []; // { id, matriculaAnterior, nome, campos }

  // Referência auxiliar por matrícula -> linha, usada depois de resolver
  // coordenador_id (que precisa do id real de quem já existe, ou marca
  // "pendente" para gente nova, resolvido no segundo passe após a criação).
  linhasValidas.forEach(l => {
    let existente = funcPorMatricula.get(l.matricula);
    if (!existente && l.email) existente = funcPorEmail.get(l.email);

    const coordDaLinha = l.papel === "membro" ? resolverCoordenadorDaLinha(l) : null;

    // Campos alinhados ao schema real de funcionarios_administrativo (ver
    // FUNCIONARIOS_BASE): nome (não nome_completo), ativo boolean (não
    // situacao/string) — funcionarios_administrativo não tem coluna
    // "situacao" nem "cargo_origem", diferente de funcionarios_comercial.
    const camposBase = {
      matricula: l.matricula,
      nome: l.nomeCompleto,
      cargo: l.cargo,
      setor: l.setor,
      email: l.email,
      ativo: l.situacao !== "INATIVO",
      equipe_id: nomeEquipe,
      // subequipe_id: só membro comum tem; gerente e coordenador não.
      subequipe_id: l.papel === "membro" ? l.supervisaoNome : null,
      // _coordenadorMatricula: resolvido para id real no passo de aplicação
      // (depois que todo mundo já foi criado/atualizado no banco).
      _coordenadorMatricula: l.papel === "membro" && coordDaLinha ? coordDaLinha.matricula
        : (l.papel === "coordenador" && gerente ? gerente.matricula : null)
    };
    const camposPreenchidos = {};
    Object.entries(camposBase).forEach(([k, v]) => {
      if (k === "_coordenadorMatricula") { camposPreenchidos[k] = v; return; }
      if (k === "ativo") { camposPreenchidos[k] = v; return; } // boolean: nunca cai no filtro de "" abaixo
      if (v !== null && v !== "") camposPreenchidos[k] = v;
    });

    if (existente) {
      funcionariosAtualizados.push({
        id: existente.id,
        matriculaAnterior: existente.matricula,
        nome: l.nomeCompleto,
        campos: existente.ativo === false ? { ...camposPreenchidos, ativo: true } : camposPreenchidos
      });
    } else {
      funcionariosNovos.push({
        ...camposBase,
        esquecimentos: 0, atestados: 0, faltas: 0, banco_horas: 0,
        erros_registro: 0, abonos: 0, integracoes: 0
      });
    }
  });

  // Quem sumiu da planilha desta equipe (existia ativo, matrícula não
  // apareceu desta vez) — só compara dentro do escopo da própria equipe,
  // nunca do administrativo inteiro, para não inativar gente de outra
  // equipe por engano.
  const matriculasNaPlanilhaSet = matriculasDaPlanilha;
  const funcionariosInativados = funcionariosExistentesTodos.filter(f =>
    f.equipe_id === nomeEquipe &&
    f.ativo !== false &&
    !matriculasNaPlanilhaSet.has(String(f.matricula || "").trim())
  );

  return {
    erros,
    semCoordenadorResolvido,
    totalLinhasPlanilha: linhasExcel.length,
    nomeEquipe,
    equipeReconhecida,
    equipeNova,
    taxaSimilaridade,
    nomeArquivoOriginal,
    gerente,
    coordenadoresNaPlanilha,
    funcionariosNovos,
    funcionariosAtualizados,
    funcionariosInativados
  };
}

// Aplica o plano no Supabase. Ordem: (1) cria/atualiza todo mundo primeiro
// SEM coordenador_id (esse campo depende de ids que só existem depois da
// criação); (2) num segundo passe, resolve coordenador_id de cada um via
// matrícula -> id e faz um update pontual só desse campo; (3) inativa quem
// sumiu.
async function aplicarImportacaoAdministrativa(plano, onProgresso) {
  const progresso = onProgresso || (() => {});
  const idPorMatricula = new Map();

  progresso(`Criando ${plano.funcionariosNovos.length} funcionário(s) novo(s)…`);
  for (const novo of plano.funcionariosNovos) {
    const { _coordenadorMatricula, ...campos } = novo;
    const { data, error } = await supa.from("funcionarios_administrativo")
      .insert(campos)
      .select().single();
    if (error) throw new Error(`Falha ao criar funcionário "${novo.nome}" (matrícula ${novo.matricula}): ${extrairMensagemErro(error)}`);
    idPorMatricula.set(novo.matricula, data.id);
    registrarLogAcessosClient({
      acao: "criar_funcionario",
      funcionario_nome: novo.nome,
      funcionario_matricula: novo.matricula,
      origem: "importacao_planilha",
      detalhe: { equipe: novo.equipe_id, subequipe: novo.subequipe_id || null }
    });
  }

  progresso(`Atualizando ${plano.funcionariosAtualizados.length} funcionário(s)…`);
  for (const at of plano.funcionariosAtualizados) {
    const { _coordenadorMatricula, ...campos } = at.campos;
    const { error } = await supa.from("funcionarios_administrativo")
      .update(campos)
      .eq("id", at.id);
    if (error) throw new Error(`Falha ao atualizar funcionário "${at.nome}": ${extrairMensagemErro(error)}`);

(function () {
  var loading = document.getElementById('loading');
  var errBox  = document.getElementById('error-box');
  var errDetail = document.getElementById('error-detail');

  function hideLoading() {
    if (loading) {
      loading.classList.add('hide');
      setTimeout(function() { if (loading) loading.style.display = 'none'; }, 450);
    }
  }

  function showError(msg) {
    hideLoading();
    if (errDetail) errDetail.textContent = String(msg);
    if (errBox) errBox.classList.add('show');
  }

  // Verifica CDNs
  if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof ReactDOM.createRoot === 'undefined') {
    showError('CDN nao carregado: React=' + (typeof React) + ' ReactDOM=' + (typeof ReactDOM) + ' Supabase=' + (typeof window.supabase));
    return;
  }

  try {
    var root = document.getElementById('root');
    ReactDOM.createRoot(root).render(React.createElement(App));
    // Remove loading apos dois frames (React ja pintou na tela)
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        hideLoading();
      });
    });
  } catch(err) {
    showError(err && (err.stack || err.message || String(err)));
  }
})();
</script>
